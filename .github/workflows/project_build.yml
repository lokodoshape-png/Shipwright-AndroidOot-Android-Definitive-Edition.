###############################################################################

name: Project Build

###############################################################################

# Builds the Android APK and publishes it on GitHub Releases.
on:
  push:
    branches: [pt-br-menu-navigation]
    tags: ['v*']
  pull_request:
    types: [opened, synchronize]
  release:
    types: [published, edited]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Prepare persistent Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::Configure the four persistent Android signing secrets before building a release APK."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/ootde-release.keystore"
          chmod 600 "$GITHUB_WORKSPACE/ootde-release.keystore"
          echo "ANDROID_KEYSTORE_FILE=$GITHUB_WORKSPACE/ootde-release.keystore" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Setup and build the project
        run: |
          cd docker
          make setup
          make build_release

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: oot-de-${{ github.ref_name }}-${{ github.run_number }}
          path: Android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Determine Android release tag
        id: version
        if: github.event_name == 'push' && github.ref == 'refs/heads/pt-br-menu-navigation' && contains(github.event.head_commit.message, '[release]')
        run: |
          VERSION_NAME=$(sed -n 's/.*versionName "\\([^"]*\\)".*/\\1/p' Android/app/build.gradle | head -n 1)
          if [ -z "$VERSION_NAME" ]; then
            echo "::error::Could not read Android versionName."
            exit 1
          fi
          git fetch --tags --force
          PREFIX="v${VERSION_NAME}-android."
          LAST=0
          for TAG in $(git tag -l "${PREFIX}*"); do
            N="${TAG#${PREFIX}}"
            if [[ "$N" =~ ^[0-9]+$ ]] && (( N > LAST )); then LAST=$N; fi
          done
          NEXT=$((LAST + 1))
          echo "tag=${PREFIX}${NEXT}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION_NAME}" >> "$GITHUB_OUTPUT"

      - name: Publish versioned APK release
        if: github.event_name == 'push' && github.ref == 'refs/heads/pt-br-menu-navigation'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: OOT Definitive Edition ${{ steps.version.outputs.version }} - Android ${{ steps.version.outputs.tag }}
          body: |
            Build Android automático da versão ${{ steps.version.outputs.version }}.

            O APK desta versão foi compilado pelo GitHub Actions a partir do commit ${{ github.sha }}.
          files: Android/app/build/outputs/apk/release/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach APK when a tag is built manually
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: Android/app/build/outputs/apk/release/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
