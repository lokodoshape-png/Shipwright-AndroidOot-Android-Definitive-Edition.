
###############################################################################

name: Project Build

###############################################################################

# Trigger the jobs on:
# - A pull request is opened or a new commit is added to the pull request
# - A new release is created or a release is edited
on:
  push:
    branches: [pt-br-menu-navigation, release/0.2.0-android-ui-ptbr]
  pull_request:
    types: [opened, synchronize]
  release:
    types: [published, edited]
  workflow_dispatch:

###############################################################################

# Jobs to run
jobs:

  # Build the project and upload Release APK to Github artifacts
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Prepare persistent Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::Configure the four persistent Android signing secrets before building a release APK."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/ootde-release.keystore"
          chmod 600 "$GITHUB_WORKSPACE/ootde-release.keystore"
          echo "ANDROID_KEYSTORE_FILE=/workspace/ootde-release.keystore" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Setup and build the project
        run: |
          cd docker
          make setup
          make build_release

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: oot-de-${{ github.ref_name }}-${{ github.run_number }}
          path: |
            Android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Attach APK to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: Android/app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

